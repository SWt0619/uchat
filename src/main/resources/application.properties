server.port=8888
server.address=0.0.0.0
# SSL 由本服务端处理
server.ssl.key-store=keystore.p12
# ⚠️ 口令只从环境变量 UCHAT_KEYSTORE_PWD 读取（2026-09-23 起不再有明文默认值）。
#     缺失时应用会启动失败 —— 这是有意的（fail-closed）。
#     启动脚本会兜底：若环境变量为空则读同目录的 keystore.pwd（该文件已加入 .gitignore）。
#     setx UCHAT_KEYSTORE_PWD "你的口令"      （Windows，之后重启服务）
#     export UCHAT_KEYSTORE_PWD='你的口令'    （Linux/macOS）
server.ssl.key-store-password=${UCHAT_KEYSTORE_PWD}
server.ssl.key-store-type=PKCS12
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-http-form-post-size=100MB

# === CORS 跨域配置 ===
# 默认 "*" 允许所有来源。部署到公网时应改为具体域名（逗号分隔多个）：
#   chat.allowed-origins=https://chat.example.com,https://chat2.example.com
# 注意：开启 HTTPS 后必须用 https:// 前缀，且不能与 "*" 混用。
# 说明：浏览器直接打开某个地址时，页面与 API 同源，CORS 其实用不到；
#       只有在「页面地址」与「后端地址」不同源时才需要把它列进来。
# 只从环境变量读取（由启动脚本从本机 allowed-origins.pwd 注入，该文件已 gitignore）；
# 未配置时退化为仅允许本机同源，避免把部署者的域名写进仓库。
chat.allowed-origins=${UCHAT_ALLOWED_ORIGINS:http://localhost:8888}

# === 生产环境 HTTPS/WSS 部署 ===
# 方案一：Spring Boot 直接配置 SSL（需证书文件）
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=changeit
# server.ssl.key-store-type=PKCS12
# server.port=8443
#
# 方案二（推荐）：Nginx/Caddy 反向代理 + Let's Encrypt 免费证书
# nginx 配置示例：
#   server {
#     listen 443 ssl;
#     server_name your-domain.com;
#     ssl_certificate /etc/letsencrypt/live/xxx/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/xxx/privkey.pem;
#     location / {
#       proxy_pass http://127.0.0.1:8888;
#       proxy_http_version 1.1;
#       proxy_set_header Upgrade $http_upgrade;
#       proxy_set_header Connection "upgrade";
#       proxy_set_header Host $host;
#     }
#   }

# === IP 白名单（启用后仅允许列表内 IP 访问） ===
# 设为 true 开启白名单防护，默认关闭
chat.ip-whitelist.enabled=false
# 允许的 IP 地址，逗号分隔。本机(127.0.0.1)始终放行无需添加。
# 支持 X-Forwarded-For / X-Real-IP 代理头（樱花Frp 等内网穿透会携带）
# 示例: chat.ip-whitelist.ips=1.2.3.4, 5.6.7.8, 192.168.1.0/24
chat.ip-whitelist.ips=

# 消息最大长度（字符数）
chat.max-message-length=5000

# === 聊天室文件存储配额（2026-09-25 用户要求）===
# 统计范围 = 用户共享文件（data/users/shared/files）+ 听歌房上传的音频（data/music）
# 超过上限时**禁止后续上传**，并提示上传者联系管理员清理空间
chat.files.max-total-gb=50

# === 音视频通话：ICE 服务器（NAT 穿透） ===
# STUN 只能发现公网地址，穿不过对称 NAT / 运营商 CGNAT / 企业防火墙。
# 双方不在同一网络时必须有 TURN 中继，否则通话必然连接失败。
# 多个用逗号分隔；google 的 STUN 在国内常不可达，建议同时配自建 STUN。
chat.stun.urls=stun:stun.miwifi.com:3478,stun:stun.l.google.com:19302

# TURN 中继。留空 = 未启用（前端只拿到 STUN，行为与旧版本一致）。
# 部署示例（coturn）：
#   turnserver.conf:
#     listening-port=3478
#     tls-listening-port=5349
#     fingerprint
#     use-auth-secret
#     static-auth-secret=<随机 32 字节 hex>
#     realm=uchat
#     cert=/etc/letsencrypt/live/your-domain.com/fullchain.pem
#     pkey=/etc/letsencrypt/live/your-domain.com/privkey.pem
# 然后填下面三项即可，前端通过 GET /api/turn 领取 1 小时有效的临时凭据。
# 可逗号分隔多个：局域网地址 + 公网隧道地址（跨网络通话用）
chat.turn.host=turn:192.168.1.222:3478?transport=udp
chat.turn.username=uchat
chat.turn.password=${UCHAT_TURN_PASSWORD:}
chat.turn.tls-host=
chat.turn.secret=
chat.turn.realm=uchat
chat.turn.ttl=3600

# === 音视频通话：房间容量与信令防护 ===
# 每个通话房间人数上限。纯 P2P Mesh 下每人上行 = (N-1) 路，
# 8 人需要 7 路上行（≈4 Mbps 纯视频流）在家庭宽带上不可行，故默认 4。
# 通话房间人数不是配置项：语音房 12 / 6 人、视频房 8 / 6 人，写死在代码常量里
# （旧版曾有 chat.call.max-per-room，但它贴在静态字段上从未生效，v2.9.15 已删除）
# 信令（video_offer/answer/ice、screen_*）单独限流：每用户每秒上限
chat.signaling.max-per-sec=60
# 单个 SDP/ICE 载荷字节上限（防超大载荷打爆内存）
chat.signaling.max-payload-bytes=32768
# 通话掉线宽限期（毫秒）：期间保留房间席位并让对端显示"重连中"，
# 网络抖动（切 WiFi / 过隧道）不再直接掐断通话。默认 45 秒。
chat.call.grace-ms=45000

# 抑制 TLS 握手误拨 HTTP 端口的日志噪音（无害，仅安静日志）
logging.level.org.apache.coyote.http11.Http11InputBuffer=OFF
# 留空时自动尝试常见路径（%LOCALAPPDATA%/osu!, C:/osu!, D:/osu!）

# ===== 公共 TURN（跨网络通话兜底；实测 openrelay 返回 401 属正常鉴权挑战）=====
# 本地 TURN 只在同一局域网可达，跨网络时浏览器会自动改用下面这条中继。
# 注意：媒体会经第三方中继转发（端到端仍是 DTLS/SRTP 加密），介意可改用自建 VPS。
chat.turn.public-urls=turn:openrelay.metered.ca:80,turn:openrelay.metered.ca:443
chat.turn.public-username=openrelayproject
chat.turn.public-password=openrelayproject

# ===== 注册码（注册时校验）=====
# 只从环境变量读取（由启动脚本从 invite.pwd 注入），源码与配置里不留明文。
# 未配置时注册功能自动禁用（fail-closed），而不是退化为"任何人都能注册"。
chat.invite.code=${UCHAT_INVITE_CODE:}

# ===== 用户角色（用于用户列表分样式；逗号分隔，未列入者为普通用户）=====
# 管理员昵称同样只从环境变量读（由 admins.pwd 注入）；未配置则没有管理员
chat.roles.admin=${UCHAT_ADMINS:}
chat.roles.bot=\u5927\u80A5\u9C7C,\u8D44\u6599\u9C7C
